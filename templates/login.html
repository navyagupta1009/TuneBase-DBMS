
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | TuneBase</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: #121212;
    color: white;
}

.container {
    width: 90%;
    max-width: 420px;
    background: #1e1e1e;
    border: 1px solid #303030;
    border-radius: 18px;
    padding: 38px;
    text-align: center;
}

.logo {
    color: #1db954;
    font-size: 34px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle { color: #aaa; margin-bottom: 28px; }

input {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    background: #292929;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 25px;
    background: #1db954;
    color: #07150b;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:hover { background: #1ed760; }

a { color: #1db954; text-decoration: none; }

a:hover { text-decoration: underline; }

.footer { color: #aaa; margin-top: 24px; font-size: 14px; }

.notice {
    padding: 10px;
    border-radius: 7px;
    margin-bottom: 10px;
    font-size: 13px;
}

.err { background: #7f1d1d; }
.ok { background: #14532d; }

</style>
</head>

<body>

<div class="container">

    <div class="logo">♫ TuneBase</div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Your music, your space.</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="notice {{ category }}">{{ message }}</div>
    {% endfor %}

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="text"
            name="identifier"
            placeholder="Username or Email"
            required
            autocomplete="username"
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
        >

        <button type="submit">LOGIN</button>
    </form>

    <div class="footer">
        Don't have an account?
        <a href="{{ url_for('register') }}">Sign Up</a>
    </div>

</div>

</body>
</html>
